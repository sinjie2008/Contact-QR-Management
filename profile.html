<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Contact Profile</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf0ff,#f8fafc 45%,#eef2f7);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);padding:18px}
.shell{width:min(520px,100%);margin:0 auto}.card{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(16,24,40,.14)}
.cover{height:190px;position:relative;background:linear-gradient(135deg,#0f172a,#2563eb)}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(15,23,42,.3))}
.content{position:relative;padding:0 24px 26px}.avatar-wrap{width:112px;height:112px;border-radius:50%;padding:5px;background:#fff;position:relative;margin-top:-56px;z-index:2;box-shadow:0 8px 24px rgba(16,24,40,.16)}.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#eef2f7}.avatar-fallback{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:30px;font-weight:800}
h1{font-size:28px;margin:14px 0 4px;line-height:1.15}.role{font-size:15px;font-weight:700;color:#344054}.company{margin-top:4px;color:var(--muted);font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}.action{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:#344054;background:#fff;font-weight:750;font-size:13px}.action.primary{background:var(--blue);border-color:var(--blue);color:#fff}.action.hidden{display:none}
.details{margin-top:20px;border-top:1px solid var(--line);padding-top:8px}.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f2f5}.k{width:82px;flex:0 0 82px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}.v{font-size:14px;word-break:break-word}.v a{color:#175cd3;text-decoration:none}
.wechat-qr{display:block;max-width:180px;max-height:180px;margin-top:8px;border:1px solid var(--line);border-radius:8px}
.bad{width:min(520px,100%);margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 16px 50px rgba(16,24,40,.1)}.bad h1{font-size:22px;margin-top:0}
@media(max-width:420px){body{padding:0}.shell{width:100%}.card{border-radius:0;min-height:100vh;border:0}.cover{height:175px}.content{padding-left:18px;padding-right:18px}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
function decodeBase64Url(s){s=String(s||"").replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var bin=atob(s),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function digits(v){return String(v||"").replace(/\D/g,"")}
function safeHttp(v){try{var u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:""}catch(e){return ""}}
function proxiedImage(v,w,h,fit){var src=safeHttp(v);if(!src)return "";var u="https://images.weserv.nl/?url="+encodeURIComponent(src)+"&output=jpg&q=85";if(w)u+="&w="+w;if(h)u+="&h="+h;if(fit)u+="&fit="+encodeURIComponent(fit);return u}
function initials(p){return (((p.firstName||"").charAt(0)+(p.lastName||"").charAt(0))||String(p.name||"P").charAt(0)).toUpperCase()}
function vEsc(v){return String(v||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}
function foldVcardLine(s){var out=[];for(var i=0;i<s.length;i+=72)out.push((i?" ":"")+s.slice(i,i+72));return out.join("\r\n")}
function bytesBase64(bytes){var out="",chunk=0x6000;for(var i=0;i<bytes.length;i+=chunk){var part=bytes.subarray(i,Math.min(bytes.length,i+chunk)),bin="";for(var j=0;j<part.length;j++)bin+=String.fromCharCode(part[j]);out+=btoa(bin)}return out}
async function contactPhoto(p){
 var src=safeHttp(p.profileImage||"");if(!src)return null;
 var urls=[proxiedImage(src,320,320,"cover"),src];
 for(var i=0;i<urls.length;i++){
  try{
   var res=await fetch(urls[i],{mode:"cors",cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);
   var blob=await res.blob();if(!/^image\//i.test(blob.type))throw new Error("Not an image");
   var bytes=new Uint8Array(await blob.arrayBuffer());if(!bytes.length)throw new Error("Empty image");
   var type=/png/i.test(blob.type)?"PNG":/jpe?g/i.test(blob.type)?"JPEG":/gif/i.test(blob.type)?"GIF":"";
   if(!type)throw new Error("Unsupported image format");
   return {base64:bytesBase64(bytes),type:type};
  }catch(e){}
 }
 return {uri:src};
}
function vcard(p,photo){
 var first=p.firstName||"",last=p.lastName||"",full=p.name||((first+" "+last).trim())||"Contact";
 var L=["BEGIN:VCARD","VERSION:3.0","N:"+vEsc(last)+";"+vEsc(first)+";;;","FN:"+vEsc(full)];
 if(photo&&photo.base64)L.push(foldVcardLine("PHOTO;ENCODING=b;TYPE="+(photo.type||"JPEG")+":"+photo.base64));
 else if(photo&&photo.uri)L.push("PHOTO;VALUE=URI:"+photo.uri);
 if(digits(p.phone))L.push("TEL;TYPE=WORK,VOICE:+"+digits(p.phone));
 if(digits(p.mobile))L.push("TEL;TYPE=CELL:+"+digits(p.mobile));
 if(digits(p.fax))L.push("TEL;TYPE=WORK,FAX:+"+digits(p.fax));
 if(p.email)L.push("EMAIL;TYPE=INTERNET:"+vEsc(p.email));
 if(safeHttp(p.website||""))L.push("URL:"+vEsc(safeHttp(p.website)));
 if(p.company)L.push("ORG:"+vEsc(p.company));
 if(p.jobTitle)L.push("TITLE:"+vEsc(p.jobTitle));
 if(p.address||p.city||p.postCode||p.country)L.push("ADR;TYPE=WORK:;;"+vEsc(p.address)+";"+vEsc(p.city)+";;"+vEsc(p.postCode)+";"+vEsc(p.country));
 var notes=[];if(p.wechatId)notes.push("WeChat ID: "+p.wechatId);
 if(p.whatsappMessage)notes.push("WhatsApp message: "+p.whatsappMessage);
 if(safeHttp(p.wechatQr||""))notes.push("WeChat QR: "+safeHttp(p.wechatQr));
 if(notes.length)L.push(foldVcardLine("NOTE:"+vEsc(notes.join("\n"))));
 L.push("END:VCARD");return L.join("\r\n");
}
async function saveContact(p){
 var btn=document.getElementById("saveContact"),status=document.getElementById("saveStatus"),old=btn.textContent;
 btn.disabled=true;btn.textContent="Preparing VCF...";if(status)status.textContent="Fetching the profile photo for the contact file.";
 try{
  var photo=await contactPhoto(p),card=vcard(p,photo),b=new Blob([card],{type:"text/vcard;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=(p.name||"contact").replace(/[^A-Za-z0-9._-]+/g,"_")+".vcf";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500);
  if(status)status.textContent=photo&&photo.base64?"VCF ready with the profile photo embedded. Open the downloaded VCF and save it in Contacts.":"VCF downloaded, but the profile image could not be embedded. Check that the image URL opens directly in a private/incognito browser tab.";
 }catch(e){if(status)status.textContent="Unable to create the contact file. Please try again.";throw e}
 finally{btn.disabled=false;btn.textContent=old}
}
function detail(label,value,href){if(!value)return "";var vv=href?'<a href="'+esc(href)+'">'+esc(value)+'</a>':esc(value);return '<div class="row"><div class="k">'+esc(label)+'</div><div class="v">'+vv+'</div></div>'}
function wechatQrDetail(url){url=safeHttp(url||"");return url?'<div class="row"><div class="k">WeChat QR</div><div class="v"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open QR image</a><img class="wechat-qr" src="'+esc(url)+'" alt="WeChat QR code" loading="lazy" referrerpolicy="no-referrer"></div></div>':""}
try{
 var raw=(location.hash.match(/(?:^#|&)p=([^&]+)/)||[])[1];if(!raw)throw new Error("Missing profile data.");
 var p=JSON.parse(decodeBase64Url(raw));if(!p||typeof p!=="object"||Array.isArray(p))throw new Error("Invalid profile data.");
 var phone=String(p.mobile||p.phone||"").trim(),wa=digits(p.mobile||""),web=safeHttp(p.website||""),pi=safeHttp(p.profileImage||""),bg=safeHttp(p.profileBackground||""),piDisplay=proxiedImage(pi,360,360,"cover")||pi,bgDisplay=proxiedImage(bg,1200,500,"cover")||bg;
 var phoneHref=digits(phone)?"tel:+"+digits(phone):"",emailHref=p.email?"mailto:"+encodeURIComponent(p.email):"",waHref=wa?"https://wa.me/"+wa+(p.whatsappMessage?"?text="+encodeURIComponent(p.whatsappMessage):""):"";
 document.title=(p.name||"Contact")+" - Profile";
 document.getElementById("app").innerHTML='<div class="shell"><main class="card"><div class="cover">'+(bgDisplay?'<img id="coverImg" src="'+esc(bgDisplay)+'" data-original="'+esc(bg)+'" alt="">':"")+'</div><div class="content"><div class="avatar-wrap">'+(piDisplay?'<img id="avatarImg" class="avatar" src="'+esc(piDisplay)+'" data-original="'+esc(pi)+'" alt="'+esc(p.name||"Profile")+'">':'<div class="avatar-fallback">'+esc(initials(p))+'</div>')+'</div><h1>'+esc(p.name||"Contact")+'</h1><div class="role">'+esc(p.jobTitle||"")+'</div><div class="company">'+esc(p.company||"")+'</div><div class="actions"><a class="action primary '+(!phoneHref?"hidden":"")+'" href="'+esc(phoneHref)+'">Call</a><a class="action '+(!waHref?"hidden":"")+'" href="'+esc(waHref)+'" target="_blank" rel="noopener noreferrer">WhatsApp</a><a class="action '+(!emailHref?"hidden":"")+'" href="'+esc(emailHref)+'">Email</a><a class="action '+(!web?"hidden":"")+'" href="'+esc(web)+'" target="_blank" rel="noopener noreferrer">Website</a><button id="saveContact" class="action primary" style="grid-column:1/-1;cursor:pointer">Download VCF</button><div id="saveStatus" class="company" style="grid-column:1/-1;text-align:center;margin-top:0">Open the downloaded VCF to save this contact. A reachable profile photo is embedded in the file.</div></div><div class="details">'+detail("First name",p.firstName,"")+detail("Last name",p.lastName,"")+detail("Mobile",p.mobile,phoneHref)+detail("Phone",p.phone,digits(p.phone)?"tel:+"+digits(p.phone):"")+detail("Fax",p.fax,digits(p.fax)?"tel:+"+digits(p.fax):"")+detail("Email",p.email,emailHref)+detail("Website",p.website,web)+detail("Company",p.company,"")+detail("Job title",p.jobTitle,"")+detail("Address",p.address,"")+detail("City",p.city,"")+detail("Post code",p.postCode,"")+detail("Country",p.country,"")+detail("WeChat ID",p.wechatId,"")+detail("WA message",p.whatsappMessage,"")+wechatQrDetail(p.wechatQr)+(typeof p.isActive==="boolean"?detail("Status",p.isActive?"Active":"Inactive",""):"")+'</div></div></main></div>';
 var av=document.getElementById("avatarImg");if(av)av.onerror=function(){var original=this.getAttribute("data-original")||"";if(original&&this.src!==original){this.src=original;this.removeAttribute("data-original")}else this.outerHTML='<div class="avatar-fallback">'+esc(initials(p))+'</div>'};
 var cv=document.getElementById("coverImg");if(cv)cv.onerror=function(){var original=this.getAttribute("data-original")||"";if(original&&this.src!==original){this.src=original;this.removeAttribute("data-original")}else this.remove()};
 document.getElementById("saveContact").onclick=function(){saveContact(p)};
}catch(e){document.getElementById("app").innerHTML='<div class="bad"><h1>Profile unavailable</h1><p>This link does not contain valid profile data. Generate a new public URL or Contact QR from Contact QR Management.</p></div>'}
</script>
</body>
</html>
