<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Contact QR Management - Secure Access</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--line:#dfe4ec;--text:#172033;--muted:#667085;--blue:#2563eb;--red:#b42318}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 0,#eaf0ff 0,#f5f7fb 38%,#eef1f6 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.lock-page{min-height:100%;display:grid;place-items:center;padding:24px}
.lock-card{width:min(430px,100%);background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 24px 70px rgba(16,24,40,.14)}
.lock-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:18px;background:#eef4ff;font-size:26px}
h1{font-size:24px;margin:0 0 8px}.sub{margin:0 0 22px;color:var(--muted);line-height:1.5;font-size:14px}
label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}
.input-wrap{position:relative}
input{width:100%;height:46px;border:1px solid #cfd6e4;border-radius:10px;padding:0 48px 0 12px;font:inherit;outline:none;background:#fff}
input:focus{border-color:#84adff;box-shadow:0 0 0 4px #eaf0ff}
.toggle{position:absolute;right:8px;top:6px;height:34px;border:0;background:transparent;color:#475467;cursor:pointer;padding:0 8px}
button[type=submit]{width:100%;height:44px;margin-top:14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:750;font-size:14px;cursor:pointer}
button[type=submit]:disabled{opacity:.6;cursor:wait}
.error{min-height:20px;margin-top:10px;color:var(--red);font-size:13px}
.note{margin-top:16px;padding-top:14px;border-top:1px solid #edf0f5;color:var(--muted);font-size:12px;line-height:1.45}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="lock-page">
  <section class="lock-card" aria-labelledby="secureTitle">
    <div class="lock-icon" aria-hidden="true">🔒</div>
    <h1 id="secureTitle">Secure Access</h1>
    <p class="sub">Enter the password to access Contact QR Management.</p>
    <form id="secureUnlockForm" autocomplete="off">
      <label for="securePassword">Password</label>
      <div class="input-wrap">
        <input id="securePassword" type="password" autocomplete="current-password" autofocus required aria-describedby="secureError">
        <button class="toggle" id="secureToggle" type="button" aria-label="Show password">Show</button>
      </div>
      <button id="secureSubmit" type="submit">Unlock</button>
      <div id="secureError" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div class="note">Authorized access only. The application payload is encrypted and is only decrypted in this browser after successful password verification.</div>
  </section>
</main>
