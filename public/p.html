<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Opening Contact Profile</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #dfe4ec;border-radius:16px;padding:24px;box-shadow:0 18px 55px rgba(16,24,40,.12);text-align:center}h1{font-size:20px;margin:0 0 8px}.muted{color:#667085;font-size:13px;line-height:1.5}</style></head><body><div class="card"><h1>Opening profile…</h1><div id="status" class="muted">Loading the latest saved profile.</div></div><script>"use strict";function id(v){v=String(v||"").trim();return /^[A-Za-z0-9_-]{1,100}$/.test(v)?v:""}function openProfile(p){if(!p||typeof p!=="object"||Array.isArray(p))throw new Error("Invalid profile data.");var token="ld_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);sessionStorage.setItem("contactQrRemoteProfile:"+token,JSON.stringify(p));var u=new URL("./profile.html",location.href);u.search="";u.hash="s="+encodeURIComponent(token);location.replace(u.href)}(async function(){try{var pid=id(decodeURIComponent((location.hash||"").replace(/^#/,"")));if(!pid)throw new Error("Missing profile ID.");var r=await fetch("/api/live-profile?id="+encodeURIComponent(pid),{cache:"no-store"}),ct=(r.headers.get("content-type")||"").toLowerCase();if(ct.indexOf("application/json")<0)throw new Error("Live profile API is not deployed. Redeploy this Site as the Vinext project with D1/R2 enabled.");var d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to load the latest profile.");openProfile(d.profile)}catch(e){document.querySelector("h1").textContent="Profile unavailable";document.getElementById("status").textContent=e&&e.message?e.message:"Unable to open this profile."}})();</script></body></html>
